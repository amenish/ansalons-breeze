[General]
showlogo=hidden
showClock=true
logo=default-logo.svg
type=image
color=#1d99f3
fontSize=10
background=5120x2880.png
needsFullUserModel=false

# Fondo según la hora (false = usa siempre «background»)
timeBackground=true
backgroundDawn=bosque_amanecer.png
backgroundDay=bosque_dia.png
backgroundDusk=bosque_atardecer.png
backgroundNight=bosque_noche.png
# Hora (0-23) a la que empieza cada franja
dawnHour=6
dayHour=9
duskHour=18
nightHour=21

# Milisegundos de cada fundido de entrada (reloj y, después, formulario); 0 = sin animación
entryDuration=1200
# true = el fondo solo se desenfoca al elegir avatar o teclear; false = siempre nítido
blurOnInteraction=true

# Altura, en % del alto de pantalla (positivo = más abajo, negativo = más arriba)
clockOffset=0
loginOffset=0
